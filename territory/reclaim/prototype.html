<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>왕국 탈환 · 비교 플레이</title><link rel="stylesheet" href="style.css"><body>
<main id="app"><header><div><small>TERRITORY / RECLAMATION</small><h1>다시, 우리의 깃발</h1></div><div class="money">골드 <b id="gold">0</b></div></header>
<div class="version"><span>탈환 실험판 · 별도 저장</span><a href="../index.html" target="_blank" rel="noopener">기존 버전 ↗</a></div>
<section id="map-view"><div class="heading"><small>햇살 숲 · 빼앗긴 땅을 되찾으세요</small><h2 id="chapter">깃발 하나에서 시작되는 왕국</h2><p id="objective"></p></div><div id="map"><svg viewBox="0 0 360 330" aria-hidden="true"><path d="M180 285L85 195L180 80L280 195L180 285"/><path d="M180 80V22"/></svg><div class="home">⚑<b id="home-title">작은 야영지</b></div><div id="nodes"></div></div>
<section id="target" class="card"></section><div class="section-title"><h3>내 군대</h3><span>배럭은 골드 · 지휘관은 영입</span></div><div id="army"></div><section id="hero" class="card"></section><details><summary>비교 설정 · 플레이 기록</summary><p>현재 실험판에만 적용됩니다. 다음 전투부터 반영돼요.</p><label><input type="checkbox" id="no-support"> 측면 궁수 지원 끄기</label><label><input type="checkbox" id="no-hans"> 한스 지휘관 제외</label><div id="history"></div><button id="reset" class="quiet">실험판만 처음부터</button></details></section>
<section id="battle-view" hidden><div class="battle-heading"><div><small id="battle-sub"></small><h2 id="battle-title"></h2></div><button id="pause" class="quiet">일시 정지</button></div><div id="field"><canvas id="battle" aria-label="자동 전투: 민병 구출, 분대 출격, 사격장 지원과 한스 지휘"></canvas><div id="event" role="status" aria-live="polite"></div><div class="field-label">본거지 ↑ 전선 · 왼쪽 길: 사격장 지원</div></div><div id="production"></div><p id="battle-tip">부대가 자동으로 싸웁니다. 성장과 편성은 전투 후 변경할 수 있어요.</p><button id="retreat" class="quiet">후퇴하고 정비</button></section>
<footer><span id="save-status">기존 버전의 저장 데이터는 사용하지 않습니다.</span></footer></main>
<dialog id="result"><small id="result-label"></small><h2 id="result-title"></h2><div id="result-body"></div><button id="return">왕국으로 돌아가기</button></dialog>
<script src="engine.js"></script><script src="art.js"></script><script src="../js/militia-combat.js"></script><script src="app.js"></script></body></html>
