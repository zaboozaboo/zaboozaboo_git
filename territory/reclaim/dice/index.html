<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>주사위 생산 · 전선 합류</title><link rel="stylesheet" href="../crowd.css"><link rel="stylesheet" href="style.css"></head><body><main id="game">
<header><div><small>원본 주사위 생산 × 새 전장</small><h1>뽑은 병력이 전선을 민다</h1></div><a href="../command/">조작판 ↗</a></header>
<section class="comparison"><div class="sizes"><button data-production="true" aria-pressed="true">주사위 생산</button><button data-production="false">생산 없이 비교</button></div><small>같은 시작 병력 · 같은 적</small></section>
<section id="field"><canvas id="battle" aria-label="주사위로 생산된 병력이 후방에서 전선에 합류하는 전장"></canvas><div class="counts"><span class="blue">병력 <b id="allies"></b></span><span class="red">적 <b id="enemies"></b></span><span class="health">영주 <b id="hp"></b></span></div><div id="notice"></div>
<div id="intro"><small>민병 4 · 궁수 2로 시작</small><h2>주사위에서<br>전선까지</h2><p>눈금만큼 두 부대가 함께 충전됩니다.<br>민병 4 · 궁수 6 충전마다 병사 1명 출진<br>후방에서 걸어와 실제 전투에 합류합니다.</p><button id="start" disabled>아트 준비 중…</button></div>
<div id="result" hidden><h2 id="outcome"></h2><p id="report"></p><button id="replay">다시 비교</button></div><button id="pause" hidden aria-label="전투 일시 정지">Ⅱ</button><div id="joystick-hint">후방 출진 → 행군 → 전선 합류</div></section>
<section class="production"><div class="dice-row"><button id="roll" disabled><span id="face">⚀</span><small id="roll-state">첫 주사위 준비</small></button><div><b id="roll-result">눈금만큼 모든 부대 충전</b><small id="arrival">전선 6명 · 행군 0명</small><label><input id="auto" type="checkbox" checked> 자동 굴림 · 원본 방식</label></div></div><div class="production-cards"><div id="militia-card"><b>민병 막사 <em id="militia-count"></em></b><progress id="militia-progress" max="4" value="0"></progress><small id="militia-charge"></small></div><div id="archer-card"><b>사격장 <em id="archer-count"></em></b><progress id="archer-progress" max="6" value="0"></progress><small id="archer-charge"></small></div></div></section>
<footer><a href="../">전선판 ↗</a><span id="elapsed">0초</span><a href="../../index.html">기존 게임 ↗</a></footer></main>
<script src="../art.js"></script><script src="../../js/data.js"></script><script src="../../js/dice.js"></script><script src="../command/engine.js"></script><script src="engine.js"></script><script src="bridge.js"></script><script src="game.js"></script></body></html>
