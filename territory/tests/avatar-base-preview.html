<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공용 몸과 의상 · 동일한 걷기</title>
<style>*{box-sizing:border-box}body{margin:0;background:#20343e;color:#eee5cf;font:14px system-ui}main{max-width:850px;margin:auto;padding:16px}h1{font-size:22px;margin:0 0 8px}p{line-height:1.6;color:#c1d1cc}nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}button,select{padding:9px;background:#eed49e;color:#26343b;border:0;border-radius:6px;font:inherit}label{display:flex;gap:6px;align-items:center}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}figure{margin:0;background:#acc19b;border-radius:12px;overflow:hidden}figcaption{color:#283f3d;text-align:center;padding:10px}canvas{width:100%;display:block}#small{background:#acc19b;border-radius:12px;height:120px}small{color:#bdccc5}</style>
<main><h1>공용 몸과 의상 · 동일한 걷기</h1><p>몸의 비율과 걸음은 공유하고, 의상만 바꿉니다. 오른쪽 튜닉은 재사용 구조를 확인하기 위한 임시 의상입니다.</p>
<nav><select id="mode" aria-label="동작"><option value="walk">걷기</option><option value="idle">서 있기</option></select><button id="pause">일시정지</button><button id="step">한 프레임</button><select id="rate" aria-label="재생 속도"><option value="1">보통 속도</option><option value=".25">느리게</option></select><label><input type="checkbox" id="bones">관절·접지</label></nav>
<div class="pair"><figure><figcaption>기본 몸</figcaption><canvas id="base"></canvas></figure><figure><figcaption>같은 동작 + 튜닉·장화</figcaption><canvas id="dressed"></canvas></figure></div>
<p>실제 표시 크기 · 23 / 46 / 69px</p><canvas id="small"></canvas><p id="status"></p><small>의상 교체에 따른 동작 변경 없음 · 원본 게임과 저장 데이터에 연결하지 않은 제작 시안</small></main>
<script src="../js/avatar-compact-rig.js"></script><script src="../js/avatar-base-renderer.js"></script><script>
const el=id=>document.getElementById(id);let t=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;el('pause').textContent=paused?'재생':'일시정지';
el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'재생':'일시정지';};el('step').onclick=()=>{paused=true;t+=1/30;el('pause').textContent='재생';render();};el('mode').onchange=()=>{t=0;render();};
function context(id,height){const cv=el(id),w=cv.getBoundingClientRect().width,dpr=devicePixelRatio||1,h=height||w*1.14;if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.height=h+'px';}const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);return {c,w,h};}
function render(){const p=CompactAvatarRig.pose(t,{mode:el('mode').value,speed:.3});for(const [id,outfit] of [['base','base'],['dressed','tunic']]){const {c,w,h}=context(id);AvatarBaseRenderer.draw(c,p,{x:w*.48,y:h*.86,scale:w*.65,outfit,bones:el('bones').checked});}const {c,w}=context('small',120);for(let i=0;i<6;i++){const size=[23,46,69][i%3];AvatarBaseRenderer.draw(c,p,{x:w*(i+.5)/6,y:90,scale:size/1.23,outfit:i<3?'base':'tunic'});}el('status').textContent=`${t.toFixed(2)}초 · 접지 ${p.legs.filter(l=>l.planted).length}발 · 두 캐릭터가 같은 포즈 데이터 사용`;}
function tick(now){if(!paused)t+=Math.min(last?(now-last)/1000:0,.05)*Number(el('rate').value);last=now;render();requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
