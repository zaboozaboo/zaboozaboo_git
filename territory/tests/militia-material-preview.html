<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>민병 채색 비교</title><style>body{margin:20px;background:#23353a;color:#eee7d5;font:15px system-ui}main{max-width:900px;margin:auto}h1{font-size:23px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}section{text-align:center}canvas{width:100%;background:#afbb9f;border-radius:12px}h2{font-size:17px}p{line-height:1.6;color:#c5d2c8}</style><main><h1>민병 준비 자세 · 채색 비교</h1><p>왼쪽 기존 채색 / 오른쪽 3D 장난감 채색 시안 · 같은 캐릭터 높이로 표시</p><div class="row"><section><h2>기존</h2><canvas id="original" width="440" height="460"></canvas></section><section><h2>3D 장난감 채색</h2><canvas id="toy" width="440" height="460"></canvas></section></div><p>작은 크기 비교 · 각 칸에서 왼쪽 24px / 가운데 46px / 오른쪽 72px</p><div class="row"><canvas id="originalSmall" width="440" height="110"></canvas><canvas id="toySmall" width="440" height="110"></canvas></div><p>준비 자세 한 장의 채색 시안입니다. 게임과 기존 애니메이션에는 적용하지 않았습니다.</p><h2>무기 채색 비교 · 도끼 / 칼</h2><p>왼쪽 기존 / 오른쪽 장난감 채색 · 도끼는 정측면으로 수정</p><div class="row"><section><img alt="기존 도끼" src="../assets/melee-base-v1/axe-large-v3.png" style="width:100%;background:#afbb9f;border-radius:12px"></section><section><img alt="정측면 장난감 도끼" src="../assets/militia-material-study/axe-side-toy-v2.png" style="width:100%;background:#afbb9f;border-radius:12px"></section><section><img alt="기존 칼" src="../assets/melee-base-v1/sword.png" style="width:100%;background:#afbb9f;border-radius:12px"></section><section><img alt="장난감 칼" src="../assets/militia-material-study/sword-toy-v1.png" style="width:100%;background:#afbb9f;border-radius:12px"></section></div></main><script>
const load=src=>new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src;});
function bounds(im,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h,0,0,w,h);const d=x.getImageData(0,0,w,h).data;let l=w,r=0,t=h,b=0;for(let y=0;y<h;y++)for(let a=0;a<w;a++)if(d[(y*w+a)*4+3]>160){l=Math.min(l,a);r=Math.max(r,a);t=Math.min(t,y);b=Math.max(b,y);}return {x:l,y:t,w:r-l+1,h:b-t+1};}
function show(im,b,id){const draw=(c,x,y,h)=>{const w=h*b.w/b.h;c.drawImage(im,b.x,b.y,b.w,b.h,x-w/2,y-h,w,h);};draw(document.getElementById(id).getContext('2d'),220,430,395);const c=document.getElementById(id+'Small').getContext('2d');[24,46,72].forEach((h,j)=>draw(c,75+j*145,92,h));}
Promise.all([load('../assets/militia-combat-v1/attack-short-stance-v3.png'),load('../assets/militia-material-study/ready-toy-eyes-v2.png')]).then(([a,b])=>{show(a,bounds(a,a.width/3,a.height/2),'original');show(b,bounds(b,b.width,b.height),'toy');});
</script></html>
