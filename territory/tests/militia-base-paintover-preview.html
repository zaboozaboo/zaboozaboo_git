<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>베이스 → 민병 복장 비교</title>
<style>body{margin:0;background:#eee9da;color:#352c27;font:16px system-ui}main{max-width:1000px;margin:30px auto;padding:0 24px}h1{font-size:24px}p{line-height:1.6}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;text-align:center;background:#faf7ef;border:1px solid #d2c9b5;border-radius:12px;padding:16px}img{display:block;width:100%;height:480px;object-fit:contain}figcaption{font-weight:700}.small img{height:80px}.overlay{position:relative;height:480px}.overlay img{position:absolute;inset:0}.overlay img:last-child{opacity:var(--mix,.5)}input{width:260px;max-width:90%}@media(max-width:600px){img,.overlay{height:300px}.pair{gap:8px}figure{padding:6px}}</style>
<main><h1>같은 베이스에 민병 복장</h1><p>큰 머리·짧은 몸의 비율을 기준으로, 머리 밖으로 떨어지는 후드와 턱 밖으로 자란 수염, 여유 있는 소매와 옷자락을 적용한 두 번째 정지 시안입니다. 원본과 겹쳐 형태 차이도 확인할 수 있습니다. 의상 외곽은 몸 밖으로 확장되며, 생성 편집으로 손발 위치에도 미세한 차이가 있습니다. 무기는 별도 부착을 위해 제외했습니다.</p>
<section class="pair"><figure><img src="../assets/animation-study/character-base-design-v1-perspective.png" alt="원본 베이스"><figcaption>원본 베이스</figcaption></figure><figure><img src="../assets/animation-study/militia-base-paintover-v2.png" alt="베이스에 민병 복장을 입힌 시안"><figcaption>민병 복장 시안</figcaption></figure></section>
<h2>작은 크기 비교</h2><section class="pair small"><figure><img src="../assets/animation-study/character-base-design-v1-perspective.png" alt="작게 본 베이스"></figure><figure><img src="../assets/animation-study/militia-base-paintover-v2.png" alt="작게 본 민병"></figure></section>
<h2>겹쳐 보기</h2><label>복장 불투명도 <input type="range" min="0" max="100" value="50" oninput="document.querySelector('.overlay').style.setProperty('--mix',this.value/100)"></label><div class="overlay"><img src="../assets/animation-study/character-base-design-v1-perspective.png" alt="비교 원본"><img src="../assets/animation-study/militia-base-paintover-v2.png" alt="겹친 복장"></div><p>이미지 편집 시안이며, 아직 분리된 의상 레이어나 애니메이션 프레임은 아닙니다.</p></main></html>
