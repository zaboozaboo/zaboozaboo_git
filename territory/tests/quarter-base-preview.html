<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쿼터뷰 기본 몸 · 01</title><style>*{box-sizing:border-box}body{margin:0;background:#22343a;color:#efe8d7;font:14px system-ui}main{max-width:820px;margin:auto;padding:18px}h1{font-size:22px;margin:0}p{line-height:1.6;color:#c5d1c9}.large{display:flex;justify-content:center;background:#aebd9f;border-radius:12px;padding:20px}canvas{display:block}.sizes{display:flex;align-items:end;justify-content:space-around;gap:16px;padding:20px 12px;border-radius:10px;background:#aebd9f;color:#263b36}.sizes.dark{background:#354448;color:#ede3ce}figure{margin:0;text-align:center;display:flex;align-items:center;flex-direction:column;gap:12px}figcaption{font-size:12px}h2{font-size:15px;font-weight:500;margin:22px 0 10px}small{color:#b8c9c0;line-height:1.6}</style><main><h1>쿼터뷰 기본 몸 · 01</h1><p>위에서 내려다보는 시점으로 새로 잡은 기본 몸입니다. 머리·어깨·발의 윗면과 가까운 팔·먼 팔의 가림을 확인합니다.</p><div class="large"><canvas data-height="300" aria-label="기본 몸 확대본"></canvas></div><h2>작은 크기 · 화면상의 캐릭터 높이</h2><div class="sizes"><figure><canvas data-height="24" aria-label="24픽셀 기본 몸"></canvas><figcaption>24px · 병사 기준</figcaption></figure><figure><canvas data-height="46" aria-label="46픽셀 기본 몸"></canvas><figcaption>46px · 영주 기준</figcaption></figure><figure><canvas data-height="72" aria-label="72픽셀 기본 몸"></canvas><figcaption>72px · 비교 확대</figcaption></figure></div><h2>어두운 배경에서 확인</h2><div class="sizes dark"><figure><canvas data-height="24" aria-label="어두운 배경 24픽셀"></canvas><figcaption>24px</figcaption></figure><figure><canvas data-height="46" aria-label="어두운 배경 46픽셀"></canvas><figcaption>46px</figcaption></figure><figure><canvas data-height="72" aria-label="어두운 배경 72픽셀"></canvas><figcaption>72px</figcaption></figure></div><p id="status">이미지 준비 중</p><small>일반 병사 논리 높이 21~24, 기본 영주 46 기준. 실제 전투에서는 화면 배율과 원근에 따라 달라집니다. 현재는 기본 몸 디자인 확인용이며 걷기·의상·게임 연결은 포함하지 않습니다.</small></main><script>
const image=new Image();image.src='../assets/quarter-base-v1/idle.png';
image.onload=()=>{const source=document.createElement('canvas');source.width=image.naturalWidth;source.height=image.naturalHeight;const ctx=source.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0);const pixels=ctx.getImageData(0,0,source.width,source.height).data;let left=source.width,top=source.height,right=0,bottom=0,count=0;for(let y=0;y<source.height;y++)for(let x=0;x<source.width;x++)if(pixels[(y*source.width+x)*4+3]>16){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y);count++;}if(!count){document.getElementById('status').textContent='이미지가 비어 있습니다';return;}const sw=right-left+1,sh=bottom-top+1;for(const canvas of document.querySelectorAll('canvas[data-height]')){const h=Number(canvas.dataset.height),w=h*sw/sh,dpr=devicePixelRatio||1;canvas.style.width=w+'px';canvas.style.height=h+'px';canvas.width=Math.ceil(w*dpr);canvas.height=Math.ceil(h*dpr);const c=canvas.getContext('2d');c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(image,left,top,sw,sh,0,0,canvas.width,canvas.height);}document.getElementById('status').textContent='투명 여백을 제외한 몸의 높이로 표시 · 정지 디자인 시안';};image.onerror=()=>document.getElementById('status').textContent='이미지를 불러오지 못했습니다';
</script></html>
