<!doctype html><html lang="ko"><meta charset="utf-8"><title>Mobile shell isolated QA</title>
<style>body{background:#182b3c;color:white;font:14px system-ui;margin:0;padding:12px}nav{display:flex;gap:8px;margin-bottom:10px}button{padding:8px}iframe{border:0;display:block;width:375px;height:640px;max-width:100%}</style>
<nav><button data-width="320">320px</button><button data-height="568">568px 높이</button><button data-height="640">640px 높이</button><button data-width="375">375px</button><button data-width="500">500px</button><button id="qa-outpost">캠프 아트 확인</button><button id="qa-victory-scene">성 함락 연출</button><button id="qa-learning">성장 순서 테스트</button><button id="qa-land-tutorial">영토 안내 테스트</button><button id="qa-battle-tutorial">전투 안내 테스트</button><button id="qa-opening">첫 충전</button><button id="qa-boss">첫 보스 승리 재현</button><button id="qa-dice">6 충전 출격</button><button id="qa-tiers">등급 카드 비교</button><button id="qa-star">별 획득 직전</button><button id="qa-growth">영토 성장 잠금</button><span>Isolated fixture · no saves read or written</span></nav><iframe title="모바일 게임 테스트"></iframe>
<script>
const frame=document.querySelector('iframe');
fetch('../index.html',{cache:'no-store'}).then(r=>r.text()).then(html=>{
 const base=new URL('../',location.href).href;
 const fixture=`<script>loadGame=()=>{newGame({name:'테스트 영주',gender:'f',cls:'knight',nation:'aurum'});S.gold=1000;S.stage=5;S.maxStage=6;S.farming=true;if(${location.search.includes('firstcamp')}){S.stage=1;S.maxStage=1;S.farming=false;prepareFirstExpedition();}return S;};saveGame=()=>{};showOffline=()=>{};window.qaOutpost=()=>{S.firstExpedition=true;S.battleTutorial='done';firstBattlePhase=null;S.territoryTutorial='done';startStage(4);B.eCastle.hp=0;B.units=B.units.filter(u=>u.team===0);endWith('win','캠프 확보');B.endDelay=Infinity;B.stageBanner=0;MobileShell.show('battle');BattleCamera.offset=cameraLimit();BattleCamera.manualUntil=Infinity;UI.refresh();};window.qaVictoryScene=()=>{S.firstExpedition=true;S.battleTutorial='done';firstBattlePhase=null;S.territoryTutorial='done';startStage(5);B.eCastle.hp=0;B.units=B.units.filter(u=>u.team===0);endWith('win','성 함락');B.endDelay=Infinity;MobileShell.show('battle');BattleCamera.offset=cameraLimit();UI.refresh();};window.qaLearning=()=>{newGame({name:'순서 테스트',gender:'f',cls:'knight',nation:'aurum'});prepareFirstExpedition();recruitFirstCompanion();S.slots[0]='militia';S.firstExpedition=true;S.battleTutorial='done';firstBattlePhase=null;S.stage=2;S.maxStage=2;S.gold=100;S.lord.merit=60;startStage(2);MobileShell.show('battle');UI.openSheet('lord');UI.refresh();};window.qaLandTutorial=()=>{S.firstExpedition=true;S.battleTutorial='done';firstBattlePhase=null;S.territoryTutorial='waiting';S.stage=5;S.maxStage=5;S.farming=false;S.kingdom.lands={};startStage(5);MobileShell.show('battle');UI.refresh();};window.qaBattleTutorial=()=>{S.firstExpedition=true;S.battleTutorial='pending';S.stage=1;S.slots=['militia',null,null,null,null];S.heroes.militia={level:1,stars:1,shards:0};startStage(1);beginFirstBattleGuide();MobileShell.show('battle');UI.refresh();};window.qaOpening=()=>{startStage(1);MobileShell.show('battle');UI.refresh();};window.qaTiers=()=>{for(const id of ['paladin','ranger','apprentice'])S.heroes[id]={level:1,stars:1,shards:0};S.slots=['paladin','ranger',null,null,null];MobileShell.show('lobby');UI.openSheet('territory');};window.qaStar=()=>{S.kingdom.growth={step:9};S.gold=10000;MobileShell.show('lobby');UI.openSheet('lord');};window.qaGrowth=()=>{S.kingdom.growth={step:10};MobileShell.show('lobby');UI.openSheet('lord');};window.qaDice=()=>{B.units=B.units.filter(u=>u.team!==0||u.isLord);S.dice.charge={militia:3,archer:5};MobileShell.show('battle');rollProduction(()=>.99);UI.refresh();};window.qaBossWin=()=>{S.maxStage=5;S.kingdom={lands:{}};startStage(5);B.result='win';finishBattle();};<\/script>`;
 frame.srcdoc=html.replace('<head>','<head><base href="'+base+'">').replace('</body>',fixture+'</body>');
});
document.getElementById('qa-outpost').onclick=()=>frame.contentWindow.qaOutpost();
document.getElementById('qa-victory-scene').onclick=()=>frame.contentWindow.qaVictoryScene();
document.getElementById('qa-learning').onclick=()=>frame.contentWindow.qaLearning();
document.getElementById('qa-land-tutorial').onclick=()=>frame.contentWindow.qaLandTutorial();
document.getElementById('qa-battle-tutorial').onclick=()=>frame.contentWindow.qaBattleTutorial();
document.getElementById('qa-opening').onclick=()=>frame.contentWindow.qaOpening();
document.getElementById('qa-tiers').onclick=()=>frame.contentWindow.qaTiers();
document.getElementById('qa-star').onclick=()=>frame.contentWindow.qaStar();
document.getElementById('qa-growth').onclick=()=>frame.contentWindow.qaGrowth();
document.getElementById('qa-dice').onclick=()=>frame.contentWindow.qaDice();
document.getElementById('qa-boss').onclick=()=>frame.contentWindow.qaBossWin();
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');
document.querySelectorAll('[data-height]').forEach(b=>b.onclick=()=>frame.style.height=b.dataset.height+'px');
</script></html>
