<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>민병 · 걷기와 공격</title>
<style>*{box-sizing:border-box}body{margin:0;background:#203c48;color:#f5eddb;font:15px system-ui;line-height:1.6}main{max-width:960px;margin:auto;padding:16px}h1{font-size:23px;margin:0}p{color:#cbdad4}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;background:#f3d48d;border:0;border-radius:8px;padding:9px 12px;color:#302f23}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}figure{margin:0}canvas{width:100%;display:block;background:#adc59e;border:2px solid #e8cf8d;border-radius:12px}figcaption{text-align:center;padding:6px}#status{color:#ffe2a2}small{color:#cbdad4}</style>
<main><h1>민병 · 걷기와 공격</h1><p>앞 걷기·공격은 원본 단날 도끼 기준입니다. 뒷모습 걷기는 도구 차단으로 수정 전 도끼가 남아 있습니다. 반대 방향은 대칭입니다.</p><nav><label>동작 <select id="action"><option value="walk">걷기</option><option value="attack">공격</option></select></label><button id="pause">일시정지</button><button id="step">한 장씩</button><label>속도 <select id="speed"><option value="1">1장/초</option><option value="2.5" selected>2.5장/초</option><option value="4">4장/초</option></select></label></nav>
<div class="grid"><figure><canvas id="nw" width="400" height="470"></canvas><figcaption>↖ 좌상 · 뒷모습 대칭</figcaption></figure><figure><canvas id="ne" width="400" height="470"></canvas><figcaption>↗ 우상 · 뒷모습</figcaption></figure><figure><canvas id="sw" width="400" height="470"></canvas><figcaption>↙ 좌하 · 앞모습 대칭</figcaption></figure><figure><canvas id="se" width="400" height="470"></canvas><figcaption>↘ 우하 · 앞모습</figcaption></figure></div><p id="status">이미지 준비 중…</p><small>각 칸: 확대 재생 / 작은 전투 크기. 같은 배율과 상체 정렬을 사용하며, 도끼나 팔다리를 따로 회전시키지 않습니다.</small></main>
<script>
const specs={front:{src:'militia-user-prompt-v1.png',rows:2,row:1,dx:34,dy:1},back:{src:'militia-back-walk.png',rows:1,row:0,dx:34,dy:0},attackFront:{src:'militia-attack-unified.png',rows:2,row:1,dx:0,dy:0},attackBack:{src:'militia-attack-unified.png',rows:2,row:0,dx:0,dy:0}};
let loaded=0,phase=0,paused=false,last=0,elapsed=0;
for(const spec of Object.values(specs)){const image=new Image();spec.image=image;image.onload=()=>loaded++;image.onerror=()=>document.getElementById('status').textContent='이미지를 불러오지 못했습니다.';image.src='../assets/animation-study/'+spec.src;}
function draw(id,spec,flip){const c=document.getElementById(id).getContext('2d'),im=spec.image,sw=im.naturalWidth/2,sh=im.naturalHeight/spec.rows;c.clearRect(0,0,400,470);
 for(const [size,y] of [[330,25],[44,407]]){const scale=size/Math.max(sw,sh);c.save();c.translate(200,y);if(flip)c.scale(-1,1);c.drawImage(im,phase*sw,spec.row*sh,sw,sh,-size/2+(phase?spec.dx*scale:0),(phase?spec.dy*scale:0),sw*scale,sh*scale);c.restore();}}
document.getElementById('action').onchange=()=>{phase=0;elapsed=0;};
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'재생':'일시정지';};
document.getElementById('step').onclick=()=>{paused=true;phase=1-phase;elapsed=0;document.getElementById('pause').textContent='재생';};
function tick(now){const dt=last?Math.min((now-last)/1000,.1):0;last=now;if(loaded===4){if(!paused){elapsed+=dt;const interval=1/Number(document.getElementById('speed').value);if(elapsed>=interval){phase=1-phase;elapsed%=interval;}}const attack=document.getElementById('action').value==='attack',back=attack?specs.attackBack:specs.back,front=attack?specs.attackFront:specs.front;draw('nw',back,true);draw('ne',back,false);draw('sw',front,true);draw('se',front,false);document.getElementById('status').textContent=(phase?'B':'A')+' · '+(paused?'정지':'재생 중');}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
