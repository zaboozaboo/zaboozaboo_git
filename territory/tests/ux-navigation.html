<!doctype html><html lang="ko"><meta charset="utf-8"><title>UX 검증 · 저장 분리</title><style>body{margin:0;padding:12px;background:#263e48;color:#fff;font:14px system-ui}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{min-height:44px}iframe{display:block;width:375px;height:720px;border:0;max-width:100%}</style><nav><button data-width="320">320px</button><button data-width="375">375px</button><button data-width="430">430px</button><button data-state="early">초기 성장</button><button data-state="late">전체 기능</button><button id="qa-layout">전체 화면 크기 검사</button><span>테스트 프로필 · 실제 저장 읽기/쓰기 없음</span></nav><pre id="qa-report"></pre><iframe title="UX 테스트 게임"></iframe><script>
const frame=document.querySelector('iframe');
if(new URLSearchParams(location.search).has('capture')){
 document.querySelector('nav').style.display='none';document.getElementById('qa-report').hidden=true;
 document.body.style.cssText='margin:0;padding:0;overflow:hidden';
 frame.style.cssText='width:375px;height:min(720px,100dvh);border:0;display:block';
}
async function load(state='late'){
 const html=await(await fetch('../index.html',{cache:'no-store'})).text();
 const fixture=`<script>loadGame=()=>{newGame({name:'UX 검증',gender:'m',cls:'knight',nation:'aurum'});S.firstExpedition=true;S.battleTutorial='done';S.territoryTutorial='done';S.stage=6;S.maxStage=11;S.gold=3000;S.gems=300;S.lord.level=15;S.lord.promo=1;S.lord.merit=300;S.kingdom={lands:{grove:'training',brook:'outpost'},growth:{step:11}};S.expeditionIntro={duel:true,war:true};for(const id of ['paladin','ranger','apprentice','spear'])S.heroes[id]={level:2,stars:1,shards:30};if('${state}'==='early'){S.stage=2;S.maxStage=2;S.lord.level=1;S.lord.promo=0;S.kingdom={lands:{},growth:{step:0}};S.learning={version:1,intro:{}};}return S;};saveGame=()=>{};showOffline=()=>{};updateBattle=()=>{};<\/script>`;
 frame.srcdoc=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace('<script src="js/main.js',fixture+'<script src="js/main.js');
}
load();document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';frame.style.height=b.dataset.width==='320'?'568px':'720px';});document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>load(b.dataset.state));

document.getElementById('qa-layout').onclick=async()=>{
 const w=frame.contentWindow,d=w.document,results=[];
 for(const tab of ['territory','lord','promo','summon','kingdom','nation']){
  w.UI.openSheet(tab);
  const views=[...d.querySelectorAll('#sheet-views button')].map(b=>b.dataset.view);
  for(const view of views){
   if((tab==='lord'&&view==='promo')||(tab==='promo'&&view!=='promo'))continue;
   w.UI.openSheet(tab);d.querySelector('#sheet-views [data-view="'+view+'"]')?.click();
   await new Promise(r=>requestAnimationFrame(r));
   const p=d.querySelector('#panel'),active=d.querySelector('#panel [role="tabpanel"]:not(.hidden)');
   if(!active)continue;
   const box=p.getBoundingClientRect(),outside=[...active.querySelectorAll('button,select')].filter(el=>!el.closest('.ux-scroll,.ux-stage,.hidden')&&el.getClientRects().length&&el.getBoundingClientRect().bottom>box.bottom+2).map(el=>el.textContent.trim().slice(0,20));
   results.push(tab+'/'+view+': panel overflow '+Math.max(0,p.scrollHeight-p.clientHeight)+'px; outside controls '+JSON.stringify(outside));
  }
 }
 document.getElementById('qa-report').textContent=results.join('\n');
};
</script></html>
