<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>민병 · 6파츠 정지 조립</title>
<style>*{box-sizing:border-box}body{margin:0;background:#20343e;color:#eee5cf;font:15px system-ui;line-height:1.6}main{max-width:1100px;margin:auto;padding:18px}h1{font-size:23px}p{color:#c5d5cf}.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}figure{margin:0}canvas{width:100%;display:block;background:#adc59e;border-radius:12px}figcaption{text-align:center;padding:8px}button{padding:9px 14px;font:inherit;border:0;border-radius:8px;background:#f0d495;margin:8px 0}#parts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}#parts canvas{background:repeating-conic-gradient(#40555c 0 25%,#354a52 0 50%) 0/20px 20px}h2{font-size:18px}@media(max-width:650px){.compare{grid-template-columns:1fr 1fr}.assembled{grid-column:1/-1;max-width:400px;justify-self:center;width:100%}#parts{grid-template-columns:repeat(2,1fr)}}</style>
<main><h1>민병 · 6파츠 정지 조립</h1><p>3·4번 원본을 기준으로 만든 파츠를 조립한 모습입니다. 움직임 없이 비율과 연결부부터 확인합니다.</p><div class="compare"><figure><canvas id="ref3" width="512" height="512"></canvas><figcaption>원본 3번</figcaption></figure><figure class="assembled"><canvas id="assembled" width="512" height="512"></canvas><figcaption>6파츠 조립 · 정지</figcaption></figure><figure><canvas id="ref4" width="512" height="512"></canvas><figcaption>원본 4번</figcaption></figure></div><button id="separate">파츠 벌려 보기</button><p id="status">이미지 불러오는 중…</p><h2>머리 · 몸통 · 왼팔 · 오른팔 · 왼다리 · 오른다리</h2><div id="parts"></div><p>팔은 어깨부터 손까지, 다리는 골반부터 부츠까지 한 장입니다. 이 정지 시안에서는 원본 도끼를 무기 든 팔에 포함했습니다.</p></main>
<script>
const names=['머리','몸통','오른팔 · 도끼','왼팔','오른다리 · 가까운 쪽','왼다리 · 먼 쪽'];
const atlas=new Image(),reference=new Image();let crops=[],spread=false;
// Destination bounds are measured against the original's squat silhouette, not the old mannequin.
const layout=[{x:170,y:63,w:240},{x:186,y:225,w:204},{x:61,y:175,w:174},{x:361,y:215,w:108},{x:207,y:331,w:130},{x:310,y:333,w:88}];
function drawPart(c,i,dx=0,dy=0){const b=crops[i],p=layout[i];c.drawImage(atlas,b.x,b.y,b.w,b.h,p.x+dx,p.y+dy,p.w,p.w*b.h/b.w);}
function render(){const c=document.getElementById('assembled').getContext('2d');c.clearRect(0,0,512,512);const offsets=[[-5,-32],[0,0],[-28,0],[30,0],[-12,28],[20,28]];for(const i of [5,4,3,1,0,2])drawPart(c,i,...(spread?offsets[i]:[0,0]));}
function bounds(i){const cw=atlas.width/3,ch=atlas.height/2,x=(i%3)*cw,y=Math.floor(i/3)*ch;const tmp=document.createElement('canvas');tmp.width=cw;tmp.height=ch;const c=tmp.getContext('2d');c.drawImage(atlas,-x,-y);const data=c.getImageData(0,0,cw,ch).data;let x0=cw,y0=ch,x1=0,y1=0;for(let yy=0;yy<ch;yy++)for(let xx=0;xx<cw;xx++)if(data[(yy*cw+xx)*4+3]>24){x0=Math.min(x0,xx);y0=Math.min(y0,yy);x1=Math.max(x1,xx);y1=Math.max(y1,yy);}return {x:x+x0,y:y+y0,w:x1-x0+1,h:y1-y0+1};}
atlas.onload=()=>{try{crops=names.map((_,i)=>bounds(i));names.forEach((name,i)=>{const figure=document.createElement('figure'),cv=document.createElement('canvas'),cap=document.createElement('figcaption');cv.width=320;cv.height=320;cap.textContent=name;figure.append(cv,cap);document.getElementById('parts').append(figure);const b=crops[i],scale=270/Math.max(b.w,b.h);cv.getContext('2d').drawImage(atlas,b.x,b.y,b.w,b.h,(320-b.w*scale)/2,(320-b.h*scale)/2,b.w*scale,b.h*scale);});render();document.getElementById('status').textContent='6파츠 준비 완료 · 자동 재생 없음';}catch(e){document.getElementById('status').textContent=e.message;}};
reference.onload=()=>{for(let i=0;i<2;i++){const c=document.getElementById(i?'ref4':'ref3').getContext('2d'),w=reference.width/2,h=reference.height/2;c.drawImage(reference,i*w,h,w,h,0,0,512,512);}};
atlas.onerror=reference.onerror=()=>document.getElementById('status').textContent='이미지를 불러오지 못했습니다.';
atlas.src='../assets/animation-study/militia-six-parts-v1.png';reference.src='../assets/animation-study/militia-user-prompt-v1.png';document.getElementById('separate').onclick=()=>{spread=!spread;document.getElementById('separate').textContent=spread?'다시 조립':'파츠 벌려 보기';if(crops.length)render();};
</script></html>
