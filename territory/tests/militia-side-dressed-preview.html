<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기존 베이스 → 민병 아장아장</title><style>*{box-sizing:border-box}body{margin:0;background:#22343a;color:#efe8d7;font:14px system-ui}main{max-width:880px;margin:auto;padding:16px}h1{font-size:22px;margin:0}p{color:#c6d2c9;line-height:1.55}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}button,select{font:inherit;border:0;border-radius:6px;background:#eed6a5;color:#273a3a;padding:9px 12px}button.active{background:#fff1cf;box-shadow:inset 0 -3px #bc884b}label{display:flex;gap:5px;align-items:center}canvas{display:block;width:100%;background:#aebb9e;border-radius:10px}#stage{height:330px}#small{height:100px}#frames{height:130px}h2{font-size:14px;font-weight:500;margin:18px 0 8px}#status{min-height:22px}small{color:#b4c7bd}</style><main><h1>기존 베이스 → 민병 아장아장</h1><p>기존 횡스크롤 베이스의 걷기 4프레임에 민병 복장을 입힌 시안입니다. 왼쪽은 원본, 오른쪽은 민병이며 같은 순서와 속도로 재생합니다.</p><nav id="actions"><button data-action="walk" class="active">아장아장</button></nav><nav><button id="pause">일시정지</button><button id="step">한 프레임</button><select id="rate" aria-label="재생 속도"><option value="1">보통 속도</option><option value="0.25">느리게 ×0.25</option></select><label><input id="weapons" type="checkbox" checked>칼</label><input id="markers" type="checkbox" hidden></nav><canvas id="stage" aria-label="선택한 동작 확대 재생"></canvas><p id="status" role="status">이미지 준비 중</p><h2>민병 · 프레임 순서</h2><canvas id="frames" aria-label="선택한 애니메이션의 모든 몸 프레임"></canvas><h2>실제 표시 크기 · 24 / 46 / 72px</h2><canvas id="small" aria-label="작은 크기에서 동작 재생"></canvas><p><small>정지/프레임 이동으로 양발 교대 확인 · 본 게임과 연결하지 않은 제작 미리보기</small></p></main><script src="../js/militia-animation.js"></script><script>
const A=CharacterBaseAnimation,el=id=>document.getElementById(id);let baseAssets,assets,action='walk',t=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
el('pause').textContent=paused?'재생':'일시정지';
function setup(id){const cv=el(id),w=cv.getBoundingClientRect().width,h=cv.getBoundingClientRect().height,dpr=devicePixelRatio||1;if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);return {c,w,h};}
function render(){if(!assets)return;const {c,w,h}=setup('stage');c.strokeStyle='#829777';c.beginPath();c.moveTo(20,h-33);c.lineTo(w-20,h-33);c.stroke();const state=A.draw(c,assets,action,t,{x:w*.72,y:h-35,height:Math.min(205,w*.41),weapons:el('weapons').checked,markers:el('markers').checked});A.draw(c,baseAssets,action,t,{x:w*.25,y:h-35,height:Math.min(205,w*.41)*.91});el('status').textContent=`${state.index+1} / ${assets.data.clips[action].durations.length} · ${state.label}${paused?' · 정지':''}`;
 const mini=setup('small');[24,46,72].forEach((height,i)=>{A.draw(mini.c,assets,action,t,{x:mini.w*(i+.5)/3,y:88,height,weapons:el('weapons').checked});});
 const strip=setup('frames'),count=assets.data.clips[action].durations.length;for(let i=0;i<count;i++){if(state.index===i){strip.c.fillStyle='#e8d69c70';strip.c.fillRect(i*strip.w/count,0,strip.w/count,strip.h);}A.draw(strip.c,assets,action,0,{x:(i+.47)*strip.w/count,y:105,height:Math.min(88,strip.w/count*.83),frame:i,weapons:el('weapons').checked});strip.c.fillStyle='#34453d';strip.c.font='12px system-ui';strip.c.fillText(String(i+1),(i+.45)*strip.w/count,123);}}
el('actions').onclick=e=>{const next=e.target.dataset.action;if(!next)return;action=next;t=0;document.querySelectorAll('[data-action]').forEach(b=>b.classList.toggle('active',b.dataset.action===next));render();};el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'재생':'일시정지';render();};el('step').onclick=()=>{if(!assets)return;paused=true;el('pause').textContent='재생';const clip=assets.data.clips[action],current=A.sample(clip,t).index,next=(current+1)%clip.durations.length;t=clip.durations.slice(0,next).reduce((a,b)=>a+b,0)+.00001;render();};
Promise.all([A.load('../assets/militia-side-dressed-v1/'),A.load('../assets/character-base-v1/')]).then(([a,b])=>{assets=a;baseAssets=b;render();}).catch(e=>{el('status').textContent=e.message;});
function tick(now){if(!paused&&assets)t+=Math.min(last?(now-last)/1000:0,.05)*Number(el('rate').value);last=now;render();requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
