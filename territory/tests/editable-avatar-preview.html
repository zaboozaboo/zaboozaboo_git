<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고정 원본 · 베이스와 민병</title><style>*{box-sizing:border-box}body{margin:0;background:#22343a;color:#ede4ce;font:14px system-ui}main{max-width:900px;margin:auto;padding:16px}h1{font-size:22px}p{line-height:1.6;color:#c5d3c9}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button,select{padding:9px;background:#ead2a0;border:0;border-radius:6px;font:inherit}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#adbea0;border-radius:12px;color:#2a413a;text-align:center;padding-top:12px}svg{display:block;width:100%;height:auto}.small{display:flex;gap:24px;justify-content:center;align-items:end;height:95px}.small svg{width:55px;height:56px}a{color:#edd39b}</style><main><h1>고정 원본 · 베이스와 민병</h1><p>같은 몸·같은 포즈에 얼굴과 복장을 교체합니다. 어깨와 손의 좌우 연결은 두 모습에서 동일합니다. 새 벡터 원본의 구조와 외형을 확인하는 작업본입니다.</p><nav><select id="mode" aria-label="동작"><option value="idle">정지</option><option value="walk">아장아장</option><option value="attack">도끼 공격</option></select><button id="play">재생</button><button id="step">한 프레임</button><label><input id="guide" type="checkbox">어깨·손 연결</label><label><input id="axe" type="checkbox" checked>도끼</label></nav><div class="pair"><div class="panel">기본 몸<div id="base"></div></div><div class="panel">민병<div id="militia"></div></div><p id="status"></p><div class="panel small"><div id="miniBase"></div><div id="miniMilitia"></div></div><p><a href="../assets/editable-avatar-v1/base.svg" download>베이스 SVG</a> · <a href="../assets/editable-avatar-v1/militia.svg" download>민병 SVG</a></p></main><script src="../js/editable-avatar.js"></script><script>const el=id=>document.getElementById(id);let t=0,last=0,paused=true;function render(){for(const [id,skin] of [['base','base'],['militia','militia'],['miniBase','base'],['miniMilitia','militia']])el(id).innerHTML=EditableAvatar.svg(t,{id,skin,mode:el('mode').value,weapon:skin==='militia'&&el('axe').checked,guides:el('guide').checked});el('status').textContent=t.toFixed(2)+'초 · 두 모습에 동일한 포즈 적용';}el('play').onclick=()=>{paused=!paused;el('play').textContent=paused?'재생':'정지';if(!paused&&el('mode').value==='idle')el('mode').value='walk';};el('step').onclick=()=>{paused=true;t+=.1;el('play').textContent='재생';render();};el('mode').onchange=()=>{t=0;render();};function tick(now){if(!paused)t+=Math.min(last?(now-last)/1000:0,.05);last=now;render();requestAnimationFrame(tick);}requestAnimationFrame(tick);</script></html>
