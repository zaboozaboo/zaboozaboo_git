<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6파츠 · 기본 아바타</title>
<style>*{box-sizing:border-box}body{margin:0;background:#20343e;color:#eee5cf;font:14px system-ui}main{max-width:920px;margin:auto;padding:16px}h1{font-size:22px;margin:0 0 8px}p{color:#becfc8;line-height:1.6}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}button,select{font:inherit;padding:9px 12px;background:#f0d495;color:#26333a;border:0;border-radius:8px}label{display:flex;align-items:center;gap:5px}canvas{display:block;width:100%;background:#acc19b;border-radius:14px;touch-action:none}small{line-height:1.7;color:#c1d1cc}#status{font-variant-numeric:tabular-nums}</style>
<main><h1>6파츠 · 기본 아바타</h1><p>머리 · 몸통 · 왼팔 · 오른팔 · 왼다리 · 오른다리. 팔은 손까지, 다리는 발까지 하나의 파츠입니다. 무기는 별도입니다.</p>
<nav><select id="mode" aria-label="동작"><option value="walk">걷기</option><option value="attack">도끼 공격</option><option value="idle">서 있기</option></select><button id="pause">일시정지</button><button id="step">한 프레임</button><label>재생<select id="rate"><option value="1">보통</option><option value="0.25">느리게 ×0.25</option></select></label><label>이동 속도<input id="speed" type="range" min="0.2" max="0.8" step="0.05" value="0.55"></label><label><input id="bones" type="checkbox">파츠 기준점 보기</label></nav>
<canvas id="stage" width="960" height="650"></canvas><p id="status">준비 중</p><small>각 팔과 다리는 관절에서 나누지 않는 한 덩어리입니다. 어깨와 골반을 기준으로 움직입니다.<br>오른쪽 아래에는 작은 전투 크기로 같은 동작을 표시합니다. 렌더링은 2D Canvas이며 WebGL이나 실시간 3D 엔진을 사용하지 않습니다.</small></main>
<script src="../js/avatar-rig.js"></script><script src="../js/avatar-parts.js"></script><script>
const canvas=document.getElementById('stage'),c=canvas.getContext('2d'),R=AvatarRig;let t=0,last=0,paused=false;
const el=id=>document.getElementById(id);el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'재생':'일시정지';};el('step').onclick=()=>{paused=true;t+=1/30;el('pause').textContent='재생';render();};el('mode').onchange=()=>{t=0;render();};el('speed').oninput=()=>{t=0;render();};
function avatar(p,ox,oy,s,bones){
 const project=v=>[ox+(v[0]-p.root-v[1])*.707*s,oy+((v[0]-p.root+v[1])*.405-v[2]*.82)*s];
 const dot=(v,r,color)=>{const a=project(v);c.beginPath();c.arc(...a,r*s,0,Math.PI*2);c.fillStyle=color;c.fill();};
 const stroke=(vs,width,color)=>{c.beginPath();vs.map(project).forEach((a,i)=>i?c.lineTo(...a):c.moveTo(...a));c.lineWidth=width*s;c.lineCap='round';c.lineJoin='round';c.strokeStyle=color;c.stroke();};
 // Six artwork sockets. IK joints are internal; they do not require separate pictures.
 const parts=AvatarParts.fromPose(p);
 const paint=(part)=>{const a=project(part.position);c.save();c.translate(...a);c.rotate(part.angle);c.fillStyle=part.color;c.beginPath();c.ellipse(0,0,part.width*s/2,part.height*s/2,0,0,Math.PI*2);c.fill();
  if(part.id==='head'){c.fillStyle='#344750';for(const x of [.06,.14]){c.beginPath();c.arc(x*s,.025*s,.014*s,0,Math.PI*2);c.fill();}}
  c.restore();};
 const paintLimb=part=>{
  const a=project(part.position),b=project(part.end),dx=b[0]-a[0],dy=b[1]-a[1],length=Math.hypot(dx,dy),w=part.width*s;
  c.save();c.translate(...a);c.rotate(Math.atan2(dy,dx)-Math.PI/2);c.fillStyle=part.color;
  // One continuous silhouette, including hand or foot. No joint pieces.
  c.beginPath();c.moveTo(-w/2,0);c.quadraticCurveTo(0,-w*.65,w/2,0);
  if(part.kind==='leg'){
   c.lineTo(w*.42,length-w*.28);c.quadraticCurveTo(w*1.25,length-w*.15,w*1.25,length+w*.18);c.quadraticCurveTo(w*.35,length+w*.6,-w*.55,length+w*.25);c.lineTo(-w*.48,length-w*.25);
  }else{
   c.lineTo(w*.40,length-w*.45);c.bezierCurveTo(w*.8,length-w*.1,w*.7,length+w*.6,0,length+w*.6);c.bezierCurveTo(-w*.7,length+w*.6,-w*.8,length-w*.1,-w*.40,length-w*.45);
  }
  c.closePath();c.fill();c.restore();
 };
 paintLimb(parts.leftLeg);paintLimb(parts.leftArm);paintLimb(parts.rightLeg);paint(parts.body);paint(parts.head);paintLimb(parts.rightArm);
 const a=p.axe,at=(u,v)=>R.add(a.hand,R.add(R.mul(a.shaft,u),R.mul(a.blade,v)));
 stroke([at(-.12,0),at(.4,0)],.045,'#805b40');
 c.beginPath();[[.43,-.025],[.46,.17],[.36,.24],[.23,.19],[.29,-.025]].map(([u,v])=>project(at(u,v))).forEach((v,i)=>i?c.lineTo(...v):c.moveTo(...v));c.closePath();c.fillStyle='#b9c9d1';c.fill();

 if(bones){for(const part of Object.values(parts)){const a=project(part.position);dot(part.position,.015,'#d17c38');if(part.end)stroke([part.position,part.end],.006,'#4b6e85');if(s>100){c.font='12px system-ui';c.fillStyle='#20343e';c.fillText(part.label,a[0]+10,a[1]-10);}}}

}

function render(){const p=R.pose(t,{mode:el('mode').value,speed:Number(el('speed').value)});c.clearRect(0,0,960,650);c.fillStyle='#acc19b';c.fillRect(0,0,960,650);
 const s=270,ox=440,oy=490;const project=(x,y)=>[ox+(x-p.root-y)*.707*s,oy+(x-p.root+y)*.405*s];c.strokeStyle='#78917066';c.lineWidth=1;
 for(let i=Math.floor(p.root)-5;i<Math.floor(p.root)+6;i++){c.beginPath();c.moveTo(...project(i,-4));c.lineTo(...project(i,4));c.stroke();}for(let i=-4;i<5;i++){c.beginPath();c.moveTo(...project(p.root-5,i));c.lineTo(...project(p.root+5,i));c.stroke();}
 avatar(p,ox,oy,s,el('bones').checked);c.fillStyle='#20343e';c.fillRect(765,470,180,160);avatar(p,855,595,45,false);c.fillStyle='#e9dfc5';c.font='16px system-ui';c.fillText('전투 크기',810,620);
 el('status').textContent=`${el('mode').selectedOptions[0].textContent} · ${t.toFixed(2)}초 · 접지 ${p.legs.filter(l=>l.planted).length}발`;
}
function tick(now){if(!paused)t+=Math.min(last?(now-last)/1000:0,.05)*Number(el('rate').value);last=now;render();requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
