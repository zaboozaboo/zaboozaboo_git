<!doctype html><meta charset="utf-8"><title>캐릭터 전신 검수</title><style>body{background:#243c50;color:white;font:14px system-ui;margin:15px}main{display:grid;grid-template-columns:repeat(5,1fr);max-width:900px;gap:8px}figure{margin:0;background:#e4efed;color:#233c4b;text-align:center;padding:8px;border-radius:8px}img{width:100%;height:140px;object-fit:contain}figcaption{font-size:12px}</style><p id="status">스프라이트 준비 중</p><main></main>
<script src="../js/data.js"></script><script src="../js/state.js"></script><script src="../js/formation.js"></script><script src="../js/battle.js"></script><script src="../js/render.js"></script><script>
Promise.all(CombatArt.files.map(src=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{CombatArt.images[src]=image;resolve();};image.onerror=reject;image.src='../'+src;}))).then(()=>{prepareCombatArt();document.querySelector('main').innerHTML=CombatArt.allies.map((a,i)=>`<figure><img src="${a.url}"><figcaption>${i<6?'영주 '+(i+1):Object.entries(ALLY_ART).find(([k,v])=>v===i)?.[0]||'예비 유닛'}</figcaption></figure>`).join('');document.getElementById('status').textContent='20개 캐릭터 · 원본 프레임 분리 / 전신 contain · 저장 데이터 미사용';}).catch(e=>document.getElementById('status').textContent='FAIL '+e.message);
</script>
