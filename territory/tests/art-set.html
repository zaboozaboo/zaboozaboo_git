<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crownward · 전장 아트 세트</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9dfc9;color:#413c31;font:14px system-ui}main{max-width:1040px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}p{line-height:1.65;color:#6d6655}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,select{font:inherit;padding:10px;border:1px solid #b9aa8b;border-radius:9px;background:#fff8e7;color:#413c31}button[aria-pressed=true]{background:#396e79;color:white}.layout{display:flex;align-items:start;gap:24px;flex-wrap:wrap}#field{width:375px;max-width:100%;height:570px;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #473a3426}#cv{width:100%;height:100%;display:block}.details{flex:1;min-width:270px}article{background:#f9f3e6;border:1px solid #cfc2a7;border-radius:14px;padding:18px;margin-bottom:16px}h2{font-size:16px;margin:0 0 12px}#motion,#set{width:100%;height:auto;display:block}small{color:#776c56}#test-status{font-size:12px}</style>
<main><h1>Crownward · 하나의 전장 세트</h1><p>캐릭터의 둥근 형태와 캠프의 재질에 맞춘 지형. 전투와 확대 동작을 함께 비교합니다.</p>
<nav><select id="region" aria-label="전장"><option value="0">고블린 숲</option><option value="1">해골 묘지</option><option value="2">오크 요새</option><option value="3">얼음 협곡</option><option value="4">마왕성</option><option value="5">왕국 공성전</option></select><select id="class" aria-label="직업"><option value="mage">마법사</option><option value="knight">기사</option><option value="priest">성직자</option></select><button id="pause">일시 정지</button><button id="reset">전투 재시작</button><button id="skill">스킬</button></nav>
<div class="layout"><div id="field"><canvas id="cv" aria-label="실제 전투"></canvas></div><div class="details"><article><h2>공통 캐릭터 동작</h2><canvas id="motion" width="600" height="260" aria-label="민병 걷기와 공격 확대"></canvas><nav><button id="slow" aria-pressed="false">느리게 보기</button></nav><small>왼쪽: 양발 교대 걷기 · 오른쪽: 6프레임 공격. 무기는 별도 이미지입니다.</small></article><article><h2>같은 전장에서 쓰는 캐릭터와 캠프</h2><canvas id="set" width="600" height="260" aria-label="캐릭터와 캠프 세트"></canvas><small>현재 사용 중인 캐릭터·몬스터·캠프 원본을 그대로 불러옵니다.</small></article><p id="test-status" role="status">아트 로딩 중 · 플레이어 저장은 사용하지 않습니다.</p></div></div></main>
<script src="../js/data.js"></script><script src="../js/state.js"></script><script src="../js/kingdom.js"></script><script src="../js/poly-dice.js"></script><script src="../js/dice.js"></script><script src="../js/formation.js"></script><script src="../js/battle.js"></script><script src="../js/camera.js"></script><script src="../js/battle-art-set.js"></script><script src="../js/militia-combat.js"></script><script src="../js/render.js"></script><script src="../js/guidance.js"></script><script src="militia-battle.js"></script>
<script>
let slow=false,clock=0,last=0;const mc=document.getElementById('motion').getContext('2d'),sc=document.getElementById('set').getContext('2d');
document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
function preview(now){clock+=Math.min(.05,(now-(last||now))/1000)*(slow?.25:1);last=now;mc.clearRect(0,0,600,260);if(MilitiaCombat.ready){
 for(let i=0;i<2;i++){mc.save();mc.translate(i?435:145,223);mc.fillStyle='#57685025';mc.beginPath();mc.ellipse(0,0,50,12,0,0,Math.PI*2);mc.fill();MilitiaCombat.paint(mc,{heroId:'militia',id:0,moving:!i,atkCd:1.5,meleeDuration:1.22,meleeStartedAt:i?Math.floor(clock/1.7)*1.7:-Infinity},clock,170,false);mc.restore();}
 sc.clearRect(0,0,600,260);[CombatArt.camps[0],CombatArt.camps[1]].forEach((a,i)=>{if(a){const h=130,w=h*a.ratio;sc.drawImage(a.image,150+i*300-w/2,0,w,h);}});
 [CombatArt.allies[0],CombatArt.allies[7],CombatArt.allies[10],CombatArt.enemies[0],CombatArt.enemies[8],CombatArt.enemies[12]].forEach((a,i)=>{if(a)sc.drawImage(a.image,50+i*100-36*a.ratio,170,72*a.ratio,72);});
 }requestAnimationFrame(preview);}requestAnimationFrame(preview);
</script></html>
