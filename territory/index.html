<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>영토, 나의 영토</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 캐릭터 생성 -->
  <section id="setup" class="screen hidden">
    <div class="logo">
      <div class="logo-sub">부하들을 이끌고 영토를 넓혀라</div>
      <h1>영토, 나의 영토</h1>
    </div>
    <div class="setup-step">
      <h3>영주의 이름</h3>
      <input id="in-name" maxlength="8" placeholder="이름 (최대 8자)" value="">
    </div>
    <div class="setup-step">
      <h3>성별</h3>
      <div class="choice-row" id="ch-gender">
        <button class="choice" data-v="m"><span class="big">🤴</span>남성 영주</button>
        <button class="choice" data-v="f"><span class="big">👸</span>여성 영주</button>
      </div>
    </div>
    <div class="setup-step">
      <h3>직업</h3>
      <div class="choice-row" id="ch-class"></div>
    </div>
    <div class="setup-step">
      <h3>소속 국가</h3>
      <div class="choice-col" id="ch-nation"></div>
    </div>
    <button id="btn-start" class="btn primary wide">영토 건국하기</button>
  </section>

  <!-- 메인 게임 -->
  <section id="game" class="screen hidden">
    <header id="topbar">
      <div class="portrait" id="tb-portrait"><canvas id="tb-portrait-cv"></canvas><span id="tb-stars"></span></div>
      <div class="tb-info">
        <div class="tb-name"><span id="tb-name"></span> <span class="lv" id="tb-lv"></span></div>
        <div class="tb-title" id="tb-title"></div>
      </div>
      <div class="tb-cur">
        <div>💰 <b id="tb-gold">0</b></div>
        <div>💎 <b id="tb-gems">0</b></div>
      </div>
    </header>
    <div id="field"><canvas id="cv"></canvas></div>
    <div id="controls">
      <div class="stage-info">
        <div id="ct-stage"></div>
        <div id="ct-power"></div>
      </div>
      <button id="btn-boss" class="btn danger small hidden">보스 도전 ▶</button>
      <button id="btn-skill" class="skill-btn"><span id="sk-icon"></span><span id="sk-cd"></span></button>
      <div class="toggles">
        <button id="btn-auto" class="btn small">AUTO</button>
        <button id="btn-speed" class="btn small">x1</button>
      </div>
    </div>
    <nav id="tabs">
      <button data-tab="territory">🏰<span>영토</span></button>
      <button data-tab="lord">👑<span>영주</span></button>
      <button data-tab="summon">🎴<span>소환</span></button>
      <button data-tab="promo">⭐<span>전직</span></button>
      <button data-tab="nation">⚔️<span>국가</span></button>
    </nav>
    <!-- 탭 내용은 전장 위로 올라오는 시트에 표시 -->
    <div id="sheet" class="hidden">
      <div class="sheet-head"><b id="sheet-title"></b><button id="sheet-close" class="btn small" aria-label="닫기">✕</button></div>
      <section id="panel"></section>
    </div>
  </section>

  <div id="modal" class="hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast"></div>
</div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/battle.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
